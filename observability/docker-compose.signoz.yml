# Joins SigNoz's OTel collector to faclab_network, where the Faclab collector (docker-compose.yml,
# S7.4) forwards to http://signoz-otel-collector:4317. Layered on SigNoz's own compose by
# scripts/signoz.sh. Its host ports go away: 4317 and 4318 on the host are the Faclab collector's,
# so nothing exports to SigNoz directly (ADR-0010).
services:
  otel-collector:
    ports: !reset []
    networks:
      - faclab_network

networks:
  faclab_network:
    external: true
