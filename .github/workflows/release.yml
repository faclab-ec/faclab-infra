name: Release

# A tag vX.Y.Z of faclab-infra publishes its two images to GitHub Container Registry, for amd64 and
# arm64: the edge Caddy (deploy/production/caddy: Caddy plus caddy-ratelimit) as faclab-caddy:X.Y.Z
# (S8.2) and PostgreSQL with pgBackRest (deploy/production/postgres) as faclab-postgres:X.Y.Z (S8.3).
# The stack of version X.Y.Z (compose.yaml, INFRA_VERSION) runs those images, so servers don't build
# them. A final version comes from master and needs its CHANGELOG.md section (scripts/release.sh); a
# pre-release (vX.Y.Z-rc.1) may come from any pushed commit and is only for staging.
# README.md, "Versiones y publicación"
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/faclab-ec

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::$TAG isn't vX.Y.Z or vX.Y.Z-<pre-release>"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: A final version comes from master and has its CHANGELOG section
        if: steps.version.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::v$VERSION isn't on master: final versions come from master (pre-releases may not)"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no $VERSION section: scripts/release.sh writes it"
            exit 1
          fi

  # One native runner per platform (the arm64 ones are free for public repositories): no
  # emulation. Each pushes its image by digest; publish joins them under the version
  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/faclab-ec/${{ matrix.image }}
    strategy:
      matrix:
        image: [faclab-caddy, faclab-postgres]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: faclab-caddy
            context: deploy/production/caddy
          - image: faclab-postgres
            context: deploy/production/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The OCI labels: source (links the package to this repository), revision, version...
      - name: Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
          flavor: latest=false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # One folder per image and platform: digests/digest-<image>-<arch>/<digest>
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the version of each image for both platforms
        working-directory: ${{ runner.temp }}/digests
        run: |
          for name in faclab-caddy faclab-postgres; do
            references=()
            for digest in digest-"$name"-*/*; do
              references+=("$REGISTRY/$name@sha256:$(basename "$digest")")
            done
            if [ "${#references[@]}" != 2 ]; then
              echo "::error::$name: expected two digests (amd64 and arm64), got ${#references[@]}"
              exit 1
            fi
            docker buildx imagetools create -t "$REGISTRY/$name:$VERSION" "${references[@]}"
          done

      - name: Check the published images
        run: |
          for name in faclab-caddy faclab-postgres; do
            image="$REGISTRY/$name:$VERSION"
            docker buildx imagetools inspect "$image"
            platforms="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' |
              jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | join(" ")')"
            if [ "$platforms" != "amd64 arm64" ]; then
              echo "::error::$name: expected amd64 and arm64, got '$platforms'"
              exit 1
            fi
            docker pull --quiet "$image"
            label="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
            if [ "$label" != "$VERSION" ]; then
              echo "::error::$name: the label org.opencontainers.image.version is '$label', not $VERSION"
              exit 1
            fi
          done
          # The rate limit module, which the Caddyfile needs, and pgBackRest
          modules="$(docker run --rm "$REGISTRY/faclab-caddy:$VERSION" caddy list-modules)"
          grep -qx 'http.handlers.rate_limit' <<< "$modules"
          docker run --rm "$REGISTRY/faclab-postgres:$VERSION" pgbackrest version
          echo "faclab-caddy and faclab-postgres $VERSION: amd64 and arm64, with http.handlers.rate_limit and pgBackRest"

      - name: GitHub release with the CHANGELOG section
        if: needs.verify.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          printf '\nImágenes (amd64 y arm64): el Caddy de entrada, %s, y PostgreSQL con pgBackRest, %s.\n' \
            "\`$REGISTRY/faclab-caddy:$VERSION\`" "\`$REGISTRY/faclab-postgres:$VERSION\`" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
