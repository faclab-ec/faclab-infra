name: Deploy

# Deploys an environment (S8.2): the versions of deploy/production/versions/<environment>.env, over
# SSH to its server, with deploy/production/scripts/deploy.sh (the same script an operator runs from
# their machine). Started by hand from master: Actions, Deploy, Run workflow. Production waits for
# the approval of its GitHub environment. The key of DEPLOY_SSH_KEY can only run remote.sh on the
# server (stack.sh authorize-ci). Guide: deploy/production/README.md, "Despliegue continuo"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [staging, production]
        required: true
      action:
        description: deploy the versions of its file, or roll back to what ran before
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

# One deployment of an environment at a time; a second one waits, never cancels the running one
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Its secret DEPLOY_SSH_KEY and its variables DEPLOY_HOST, DEPLOY_KNOWN_HOSTS and, optionally,
    # DEPLOY_PORT and DEPLOY_USER
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      # The server's host key is pinned (DEPLOY_KNOWN_HOSTS): never StrictHostKeyChecking=no
      - name: SSH key and known host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::the environment needs the secret DEPLOY_SSH_KEY and the variable DEPLOY_KNOWN_HOSTS"
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy

      - name: ${{ inputs.action }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          export FACLAB_SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_deploy -o ServerAliveInterval=30 -p ${DEPLOY_PORT:-22} ${DEPLOY_USER:-deploy}@${DEPLOY_HOST:?the environment needs the variable DEPLOY_HOST}"
          set +e
          deploy/production/scripts/deploy.sh "$ENVIRONMENT" "$ACTION"
          status=$?
          set -e
          case "$status" in
            0) result="$ACTION of $ENVIRONMENT: done" ;;
            3) result="$ACTION of $ENVIRONMENT: FAILED, rolled back automatically (the previous versions run)" ;;
            *) result="$ACTION of $ENVIRONMENT: FAILED (exit $status), check the log and stack.sh status" ;;
          esac
          echo "$result"
          echo "### $result" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
