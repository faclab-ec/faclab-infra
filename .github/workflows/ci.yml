name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config -q

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      # Clones SigNoz's deploy/ at the pinned tag and validates it with our overlay
      - name: Validate SigNoz local
        run: SIGNOZ_DIR="$RUNNER_TEMP/signoz" scripts/signoz.sh config
