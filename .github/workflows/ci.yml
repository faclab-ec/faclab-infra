name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config -q

      # observability/otel-collector/config.yaml against the pinned image, with the service's
      # volumes and environment (S7.4)
      - name: Validate the OTel Collector configuration
        run: >-
          docker compose --env-file .env.example run --rm --no-deps collector
          validate --config=/etc/otelcol-contrib/config.yaml

      # The Collector with its real processors and a file exporter: sensitive keys sent in
      # resources, spans, span events, metric points and logs must not reach the file, and the
      # browser's receiver only takes faclab-web (S7.6)
      - name: Check the Collector's redaction
        run: python3 scripts/collector-redaction-test.py

      - name: ShellCheck
        run: shellcheck scripts/*.sh deploy/production/scripts/*.sh deploy/production/drill/*.sh e2e/*.sh

      # The end-to-end environment (S9.1): the SRI simulator's tests and the compose file. The suite
      # itself runs in e2e.yml
      - name: Check the end-to-end environment
        run: |
          node --test e2e/sri-simulator/server.test.mjs
          E2E_DB_PASSWORD=ci docker compose -f e2e/compose.yaml config -q

      # The workflows (S8.2): release and deploy only run on a tag or by hand, so this is what
      # checks them on every PR. The image brings shellcheck for their run: blocks
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # deploy/production (S8.1, S8.2): compose with each env and versions file, the versions against
      # the compatibility matrix, the edge Caddy (image and Caddyfile in both TLS modes), the
      # Collector with its production overlay, and no secret file versioned
      - name: Validate the production stack
        run: deploy/production/scripts/ci-validate.sh

      # Downloads the pinned foundryctl (checked against its sha256), forges
      # observability/signoz/casting.yaml and validates the generated compose file (S7.5)
      - name: Validate SigNoz local
        run: scripts/signoz.sh config

      # Dashboards (v6), alerts (v2alpha1) and runbooks, offline: structure, panel descriptions,
      # runbook links and the index (S7.5)
      - name: Validate dashboards and alerts
        run: python3 scripts/signoz-sync.py check
