name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config -q

      # observability/otel-collector/config.yaml against the pinned image, with the service's
      # volumes and environment (S7.4)
      - name: Validate the OTel Collector configuration
        run: >-
          docker compose --env-file .env.example run --rm --no-deps collector
          validate --config=/etc/otelcol-contrib/config.yaml

      # The Collector with its real processors and a file exporter: sensitive keys sent in
      # resources, spans, span events, metric points and logs must not reach the file, and the
      # browser's receiver only takes faclab-web (S7.6)
      - name: Check the Collector's redaction
        run: python3 scripts/collector-redaction-test.py

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      # Downloads the pinned foundryctl (checked against its sha256), forges
      # observability/signoz/casting.yaml and validates the generated compose file (S7.5)
      - name: Validate SigNoz local
        run: scripts/signoz.sh config

      # Dashboards (v6), alerts (v2alpha1) and runbooks, offline: structure, panel descriptions,
      # runbook links and the index (S7.5)
      - name: Validate dashboards and alerts
        run: python3 scripts/signoz-sync.py check
