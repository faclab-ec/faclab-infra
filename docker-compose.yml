services:
  kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    container_name: kafka
    restart: unless-stopped
    environment:
      # KRaft mode (sin Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:${KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Cluster
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Storage
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - faclab_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION}
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: faclab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT}:8080"
    networks:
      - faclab_network

  # Base propia de faclab-invoicing: faclab_invoicing y faclab_invoicing_test (scripts/init-invoicing-db.sh).
  # Los valores por defecto permiten usar un .env anterior sin cambios
  invoicing-db:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: invoicing-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${INVOICING_DB_SUPERUSER_PASSWORD:-postgres}
      INVOICING_DB_PASSWORD: ${INVOICING_DB_PASSWORD:-faclab_invoicing}
    ports:
      - "${INVOICING_DB_PORT:-5434}:5432"
    volumes:
      - invoicing_db_data:/var/lib/postgresql/data
      - "./scripts/init-invoicing-db.sh:/docker-entrypoint-initdb.d/init-invoicing-db.sh:ro"
    networks:
      - faclab_network
    healthcheck:
      # Por TCP: en el primer arranque los scripts de inicio corren en un servidor que solo escucha en el socket
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "faclab_invoicing", "-d", "faclab_invoicing"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kafka_data:
    driver: local
  invoicing_db_data:
    driver: local

networks:
  faclab_network:
    name: faclab_network
    driver: bridge
