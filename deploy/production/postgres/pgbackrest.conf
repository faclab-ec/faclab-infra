# pgBackRest of Faclab (S8.3, deploy/production/RESPALDOS.md). compose.yaml mounts it in the postgres
# container, where archive_command runs and scripts/backups.sh takes the backups. What changes per
# environment comes as PGBACKREST_* variables of the service, which pgBackRest reads as options:
# the repository's endpoint, bucket, region and port, its keys and the passphrase that encrypts it.

[global]
# A bucket of an S3-compatible service outside the server, never the Garage of the stack
repo1-type=s3
repo1-path=/pgbackrest
# Most S3-compatible services take bucket/key paths; AWS takes both
repo1-s3-uri-style=path

# Encrypted on the server before it leaves: AES-256 with PGBACKREST_REPO1_CIPHER_PASS. Losing it
# makes every backup unreadable: it lives in the sops secrets
repo1-cipher-type=aes-256-cbc

# Four full backups (one a week): four to five weeks of point-in-time recovery. The WAL older than
# the oldest full backup expires with it
repo1-retention-full-type=count
repo1-retention-full=4

compress-type=zst
compress-level=3
process-max=2
# The backup starts with an immediate checkpoint instead of waiting for the next one
start-fast=y

# WAL is pushed in the background: archive_command only queues it, and a slow or unreachable
# repository doesn't hold PostgreSQL. Past the queue limit pgBackRest drops WAL to protect the disk
# (logged, and the point-in-time recovery has a gap until the next backup)
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=4GiB
archive-get-queue-max=1GiB

lock-path=/tmp/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info
log-level-stderr=off

[faclab]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
