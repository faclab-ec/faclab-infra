# Builds the images of faclab-core, faclab-invoicing and faclab-web on the server, from their public
# repositories at a fixed ref (a tag or a commit SHA: *_REF in env/<environment>.env). It is the way
# until S8.2 publishes them to GHCR; then *_IMAGE points there and this file goes away.
#
# scripts/stack.sh adds it when the env file says IMAGES_FROM=git and builds one image at a time
# (stack.sh build), so the workers and the tasks find theirs already built and never pull them.

services:
  core-api:
    build:
      context: https://github.com/faclab-ec/faclab-api.git#${CORE_REF:?}
      target: production
      args:
        SERVICE_VERSION: ${CORE_REF:?}
  core-worker:
    pull_policy: never
  core-migrate:
    pull_policy: never

  invoicing-api:
    build:
      context: https://github.com/faclab-ec/faclab-invoicing.git#${INVOICING_REF:?}
      target: production
      args:
        SERVICE_VERSION: ${INVOICING_REF:?}
  invoicing-worker:
    pull_policy: never
  invoicing-migrate:
    pull_policy: never

  web:
    build:
      context: https://github.com/faclab-ec/faclab-web.git#${WEB_REF:?}
      target: production
      args:
        SERVICE_VERSION: ${WEB_REF:?}
